# Local MySQL configuration; supply credentials through the environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecm_db}
spring.datasource.username=${DB_USERNAME:ecm}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Required Base64-encoded random key, at least 32 bytes before encoding.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
